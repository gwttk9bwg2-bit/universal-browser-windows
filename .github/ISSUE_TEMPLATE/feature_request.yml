name: Feature request
description: Propose a focused browser-control capability or workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What browser task cannot be completed reliably today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Browser, site pattern, and alternatives
      description: Include the browser mode and safe examples if available.
