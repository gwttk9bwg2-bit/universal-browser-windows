name: Bug report
description: Report a reproducible Universal Browser problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Universal Browser. Remove credentials and private page content before posting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Microsoft Edge, Google Chrome, Chromium, Mozilla Firefox, Windows native UI]
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection mode
      options: [Managed browser, Extension/native host, CDP, Windows fallback, Unknown]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
      description: Paste redacted output from scripts/diagnose-windows.ps1 when relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, cookies, tokens, personal URLs, and private page content.
          required: true
