name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium firefox --no-shell
      - run: npm run check
      - name: Assemble portable package
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputDirectory release -SkipChecks
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/universal-browser-windows-*-portable.zip
